AWSTemplateFormatVersion: '2010-09-09'
Description: FinOps EC2 Cost & Utilization Collector with Step Functions and EventBridge Scheduling

Parameters:
  S3BucketName:
    Type: String
    Description: S3 Bucket for FinOps data

  AccountProcessingQueueName:
    Type: String
    Default: FinOpsAccountQueue
    Description: SQS queue name for account processing

  DeadLetterQueueName:
    Type: String
    Default: FinOpsAccountDLQ
    Description: SQS Dead Letter Queue for failures

  LambdaExecutionRoleName:
    Type: String
    Default: FinOpsLambdaExecutionRole
    Description: IAM Role name for Lambda functions

Resources:

  FinOpsDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 365

  FinOpsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref DeadLetterQueueName

  FinOpsAccountQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref AccountProcessingQueueName
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FinOpsDLQ.Arn
        maxReceiveCount: 5

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref LambdaExecutionRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FinOpsLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}
                  - !Sub arn:aws:s3:::${S3BucketName}/*
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt FinOpsAccountQueue.Arn
                  - !GetAtt FinOpsDLQ.Arn
              - Effect: Allow
                Action:
                  - organizations:ListChildren
                  - organizations:DescribeAccount
                  - organizations:ListAccounts
                  - organizations:ListTagsForResource
                  - sts:AssumeRole
                  - ec2:DescribeInstances
                  - cloudwatch:GetMetricData
                  - cloudtrail:LookupEvents
                  - ce:GetCostAndUsage
                  - ce:GetReservationUtilization
                Resource: '*'

  # Lambda 1: GatherCostInfoLambda
  GatherCostInfoLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GatherCostInfoLambda
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      Code:
        ZipFile: |
          import boto3
          import os
          import json
          import datetime
          from botocore.exceptions import ClientError

          ce = boto3.client('ce')
          cloudwatch = boto3.client('cloudwatch')
          s3 = boto3.client('s3')

          def get_cost_data(start, end):
              """Get EC2 cost for the given time range (on-demand and reserved)."""
              try:
                  response = ce.get_cost_and_usage(
                      TimePeriod={'Start': start, 'End': end},
                      Granularity='DAILY',
                      Metrics=['UnblendedCost'],
                      Filter={
                          'Dimensions': {
                              'Key': 'SERVICE',
                              'Values': ['Amazon Elastic Compute Cloud - Compute']
                          }
                      }
                  )
                  return response
              except ClientError as e:
                  print(f"Error fetching cost data: {e}")
                  return None

          def get_metric_statistics(instance_id, metric_name, start, end, stat, period=300, namespace='AWS/EC2', unit=None):
              """Fetch CloudWatch metric statistics for an EC2 instance."""
              try:
                  params = {
                      'Namespace': namespace,
                      'MetricName': metric_name,
                      'Dimensions': [{'Name': 'InstanceId', 'Value': instance_id}],
                      'StartTime': start,
                      'EndTime': end,
                      'Period': period,
                      'Statistics': [stat],
                  }
                  if unit:
                      params['Unit'] = unit
                  response = cloudwatch.get_metric_statistics(**params)
                  datapoints = response.get('Datapoints', [])
                  if not datapoints:
                      return None
                  # Return average of the datapoints' values
                  values = [dp[stat] for dp in datapoints]
                  avg_value = sum(values) / len(values)
                  max_value = max(values)
                  return {'average': avg_value, 'max': max_value}
              except ClientError as e:
                  print(f"Error fetching metric {metric_name} for {instance_id}: {e}")
                  return None

          def lambda_handler(event, context):
              # Calculate date range for last 14 days
              end = datetime.datetime.utcnow()
              start = end - datetime.timedelta(days=14)

              start_str = start.strftime('%Y-%m-%d')
              end_str = end.strftime('%Y-%m-%d')

              # 1. Fetch overall EC2 cost for last 14 days
              cost_response = get_cost_data(start_str, end_str)
              if not cost_response:
                  return {'statusCode': 500, 'body': 'Failed to retrieve cost data'}

              # 2. Get EC2 instance IDs to analyze utilization metrics
              # You can adapt this: here, assuming event provides list of instance IDs or query all running instances
              # For demo, let's assume a fixed list or you can enhance to fetch dynamically

              # For demonstration, let's scan EC2 running instances in this account
              ec2 = boto3.client('ec2')
              instances_resp = ec2.describe_instances(Filters=[{'Name': 'instance-state-name', 'Values': ['running']}])
              instance_ids = []
              for reservation in instances_resp.get('Reservations', []):
                  for instance in reservation.get('Instances', []):
                      instance_ids.append(instance['InstanceId'])

              # 3. Collect utilization metrics per instance
              utilization_summary = {}
              for instance_id in instance_ids:
                  cpu_stats = get_metric_statistics(instance_id, 'CPUUtilization', start, end, 'Average')
                  cpu_max_stats = get_metric_statistics(instance_id, 'CPUUtilization', start, end, 'Maximum')
                  cpu_credit_usage = get_metric_statistics(instance_id, 'CPUCreditUsage', start, end, 'Sum', unit='Count')
                  cpu_credit_balance = get_metric_statistics(instance_id, 'CPUCreditBalance', start, end, 'Average')

                  utilization_summary[instance_id] = {
                      'CPUUtilizationAvg14d': cpu_stats['average'] if cpu_stats else None,
                      'CPUUtilizationMax5m': cpu_max_stats['max'] if cpu_max_stats else None,
                      'CPUCreditUsageSum14d': cpu_credit_usage['average'] if cpu_credit_usage else None,
                      'CPUCreditBalanceAvg14d': cpu_credit_balance['average'] if cpu_credit_balance else None,
                  }

              # 4. Basic Utilization Classification (example logic)
              # Under-utilized: Avg CPU < 10% and Credit Balance > 50 (burstable)
              # Over-utilized: Avg CPU > 80%
              classification = {}
              for instance_id, metrics in utilization_summary.items():
                  avg_cpu = metrics.get('CPUUtilizationAvg14d') or 0
                  credit_balance = metrics.get('CPUCreditBalanceAvg14d') or 0

                  if avg_cpu < 10 and credit_balance > 50:
                      classification[instance_id] = 'Under-utilized'
                  elif avg_cpu > 80:
                      classification[instance_id] = 'Over-utilized'
                  else:
                      classification[instance_id] = 'Normal'

              # 5. Prepare final data to store in S3
              final_data = {
                  'CostData': cost_response,
                  'InstanceUtilization': utilization_summary,
                  'Classification': classification,
                  'Period': {'Start': start_str, 'End': end_str}
              }

              s3_key = f"data/cost-info/ec2_cost_utilization_{start_str}_to_{end_str}.json"
              s3.put_object(
                  Bucket=os.environ['S3_BUCKET_NAME'],
                  Key=s3_key,
                  Body=json.dumps(final_data).encode('utf-8')
              )

              return {
                  'statusCode': 200,
                  'body': f"Cost and utilization data collected and stored in {s3_key}"
              }

  # Lambda 2: GatherOrgAccountsLambda
  GatherOrgAccountsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GatherOrgAccountsLambda
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref FinOpsAccountQueue
          S3_BUCKET_NAME: !Ref S3BucketName
          TARGET_OU_ID: ou-m23i-wafn3pqo
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          sqs = boto3.client('sqs')
          org = boto3.client('organizations')
          s3 = boto3.client('s3')

          def get_account_tags(account_id):
              try:
                  tags_response = org.list_tags_for_resource(ResourceId=account_id)
                  tags = {t['Key'].lower(): t['Value'] for t in tags_response.get('Tags', [])}
                  # Lowercase keys for easy lookup
                  return tags
              except Exception as e:
                  # Log or handle error if needed
                  print(f"Error fetching tags for account {account_id}: {e}")
                  return {}

          def list_accounts_in_ou(ou_id):
              accounts = []
              paginator = org.get_paginator('list_children')
              for page in paginator.paginate(ParentId=ou_id, ChildType='ACCOUNT'):
                  for child in page['Children']:
                      account_id = child['Id']
                      account = org.describe_account(AccountId=account_id)['Account']
                      tags = get_account_tags(account_id)

                      accounts.append({
                          'Id': account['Id'],
                          'Name': account.get('Name'),
                          'Email': account.get('Email'),
                          'Status': account.get('Status'),
                          'Owner': tags.get('owner'),
                          'ProjectID': tags.get('project-id'),
                          'Environment': tags.get('environment')
                      })
              return accounts

          def lambda_handler(event, context):
              ou_id = os.environ.get('TARGET_OU_ID')
              if not ou_id:
                  return {
                      'statusCode': 400,
                      'message': 'TARGET_OU_ID environment variable not set'
                  }

              accounts = list_accounts_in_ou(ou_id)

              for acc in accounts:
                  sqs.send_message(QueueUrl=os.environ['SQS_QUEUE_URL'], MessageBody=json.dumps(acc))

              csv_content = "Id,Name,Email,Status,Owner,ProjectID,Environment\n"
              for acc in accounts:
                  csv_content += f"{acc['Id']},{acc['Name']},{acc['Email']},{acc['Status']},{acc.get('Owner','')},{acc.get('ProjectID','')},{acc.get('Environment','')}\n"
              s3.put_object(Bucket=os.environ['S3_BUCKET_NAME'], Key='accounts/accounts.csv', Body=csv_content.encode('utf-8'))

              return {
                  'statusCode': 200,
                  'message': f'{len(accounts)} accounts processed',
                  'accountsList': accounts
              }



  # Lambda 3: ProcessInstancesLambda
  ProcessInstancesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ProcessInstancesLambda
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime, timedelta

          sts = boto3.client('sts')
          s3 = boto3.client('s3')

          CPU_METRICS = {
              "CPUUtilization": ["Maximum", "Average"],
              "CPUCreditUsage": ["Sum", "Average"],
              "CPUCreditBalance": ["Sum", "Average"],
          }

          def assume_role(account_id, role_name='FinOpsCrossAccountRole'):
              role_arn = f'arn:aws:iam::{account_id}:role/{role_name}'
              response = sts.assume_role(RoleArn=role_arn, RoleSessionName='FinOpsSession')
              creds = response['Credentials']
              return boto3.Session(
                  aws_access_key_id=creds['AccessKeyId'],
                  aws_secret_access_key=creds['SecretAccessKey'],
                  aws_session_token=creds['SessionToken']
              )

          def get_metric_data(cloudwatch_client, instance_id, metric_name, statistic, start_time, end_time):
              response = cloudwatch_client.get_metric_statistics(
                  Namespace='AWS/EC2',
                  MetricName=metric_name,
                  Dimensions=[{'Name': 'InstanceId', 'Value': instance_id}],
                  StartTime=start_time,
                  EndTime=end_time,
                  Period=300,  # 5 minutes
                  Statistics=[statistic]
              )
              datapoints = sorted(response.get('Datapoints', []), key=lambda x: x['Timestamp'])
              # Return list of timestamp and value dicts
              return [{'Timestamp': dp['Timestamp'].isoformat(), statistic: dp[statistic]} for dp in datapoints]

          def get_instance_metadata(ec2_client, instance):
              instance_id = instance['InstanceId']
              instance_type = instance['InstanceType']
              
              # Get vCPU count from instance type info
              it_resp = ec2_client.describe_instance_types(InstanceTypes=[instance_type])
              vcpu_count = None
              if it_resp['InstanceTypes']:
                  vcpu_count = it_resp['InstanceTypes'][0]['VCpuInfo']['DefaultVCpus']

              # Extract Name tag if exists
              name = None
              if 'Tags' in instance:
                  for tag in instance['Tags']:
                      if tag['Key'] == 'Name':
                          name = tag['Value']
                          break

              # OS info from 'Platform' or fallback to describe_images
              platform = instance.get('Platform')  # usually "windows" or None for Linux
              platform_details = instance.get('PlatformDetails')  # e.g. "Linux/UNIX", "Windows"
              os_info = platform_details if platform_details else ("Windows" if platform == "windows" else "Linux/UNIX")

              return {
                  "InstanceId": instance_id,
                  "Name": name,
                  "InstanceType": instance_type,
                  "vCPU": vcpu_count,
                  "OS": os_info,
                  "Platform": platform
              }

          def lambda_handler(event, context):
              account_id = event.get('account_id')
              next_token = event.get('NextToken', None)

              if not account_id:
                  return {'statusCode': 400, 'message': 'Missing account_id'}

              session = assume_role(account_id)
              ec2_client = session.client('ec2')
              cloudwatch_client = session.client('cloudwatch')

              if next_token:
                  response = ec2_client.describe_instances(NextToken=next_token)
              else:
                  response = ec2_client.describe_instances()

              instances = []
              for reservation in response.get('Reservations', []):
                  for instance in reservation.get('Instances', []):
                      instances.append(instance)

              end = datetime.utcnow()
              start = end - timedelta(days=14)

              for instance in instances:
                  metadata = get_instance_metadata(ec2_client, instance)
                  metrics = {}

                  for metric_name, stats in CPU_METRICS.items():
                      metrics[metric_name] = {}
                      for stat in stats:
                          data = get_metric_data(cloudwatch_client, metadata['InstanceId'], metric_name, stat, start, end)
                          metrics[metric_name][stat] = data

                  output_record = {
                      "AccountId": account_id,
                      "InstanceMetadata": metadata,
                      "Metrics": metrics,
                      "MetricsPeriod": {"Start": start.isoformat(), "End": end.isoformat()}
                  }

                  key = f'instances/{account_id}_{metadata["InstanceId"]}.json'
                  s3.put_object(Bucket=os.environ['S3_BUCKET_NAME'], Key=key, Body=json.dumps(output_record).encode('utf-8'))

              return {
                  "statusCode": 200,
                  "NextToken": response.get('NextToken', None),
                  "account_id": account_id
              }


  # IAM Role for Step Functions
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FinOpsStepFunctionsExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsInvokeLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt GatherCostInfoLambda.Arn
                  - !GetAtt GatherOrgAccountsLambda.Arn
                  - !GetAtt ProcessInstancesLambda.Arn
                  - !GetAtt TerminatedInstancesLambda.Arn

  TerminatedInstancesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TerminatedInstancesLambda
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      Code:
        ZipFile: |
          import boto3
          import os
          import datetime
          import json

          cloudtrail = boto3.client('cloudtrail')
          s3 = boto3.client('s3')

          def lambda_handler(event, context):
              end_time = datetime.datetime.utcnow()
              start_time = end_time - datetime.timedelta(days=14)
              
              response = cloudtrail.lookup_events(
                  LookupAttributes=[{'AttributeKey': 'EventName', 'AttributeValue': 'TerminateInstances'}],
                  StartTime=start_time,
                  EndTime=end_time,
                  MaxResults=50
              )
              
              terminated_instances = []
              
              for event in response.get('Events', []):
                  event_detail = json.loads(event['CloudTrailEvent'])
                  instances = event_detail.get('requestParameters', {}).get('instancesSet', {}).get('items', [])
                  user_identity = event_detail.get('userIdentity', {})
                  termination_time = event['EventTime'].isoformat()
                  
                  for inst in instances:
                      terminated_instances.append({
                          'InstanceId': inst.get('instanceId'),
                          'TerminationTime': termination_time,
                          'TerminatedBy': user_identity.get('arn', 'Unknown')
                      })
              
              key = f"terminated_instances/terminated_{start_time.strftime('%Y%m%d')}_to_{end_time.strftime('%Y%m%d')}.json"
              s3.put_object(
                  Bucket=os.environ['S3_BUCKET_NAME'],
                  Key=key,
                  Body=json.dumps(terminated_instances).encode('utf-8')
              )
              
              return {
                  'statusCode': 200,
                  'message': f"Found and stored {len(terminated_instances)} terminated instances",
                  'dataKey': key
              }

  # Step Functions State Machine
  FinOpsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString:
        !Sub |
          {
            "Comment": "FinOps Efficiency Collection Workflow with status filter",
            "StartAt": "GatherCostInfo",
            "States": {
              "GatherCostInfo": {
                "Type": "Task",
                "Resource": "${GatherCostInfoLambda.Arn}",
                "ResultPath": "$.cost",
                "Next": "FetchTerminatedInstances"
              },
              "FetchTerminatedInstances": {
                "Type": "Task",
                "Resource": "${TerminatedInstancesLambda.Arn}",
                "ResultPath": "$.terminated",
                "Next": "GatherOrgAccounts"
              },
              "GatherOrgAccounts": {
                "Type": "Task",
                "Resource": "${GatherOrgAccountsLambda.Arn}",
                "ResultPath": "$.gathered",
                "Next": "ProcessAccountsMap"
              },
              "ProcessAccountsMap": {
                "Type": "Map",
                "ItemsPath": "$.gathered.accountsList",
                "Parameters": {
                  "account_id.$": "$$.Map.Item.Value.Id",
                  "account_name.$": "$$.Map.Item.Value.Name",
                  "email.$": "$$.Map.Item.Value.Email",
                  "status.$": "$$.Map.Item.Value.Status"
                },
                "Iterator": {
                  "StartAt": "CheckIfSuspended",
                  "States": {
                    "CheckIfSuspended": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.status",
                          "StringEquals": "SUSPENDED",
                          "Next": "SkipSuspendedAccount"
                        }
                      ],
                      "Default": "ProcessInstancesLoop"
                    },
                    "SkipSuspendedAccount": {
                      "Type": "Pass",
                      "Result": {
                        "skipped": true,
                        "reason": "Suspended account"
                      },
                      "End": true
                    },
                    "ProcessInstancesLoop": {
                      "Type": "Task",
                      "Resource": "${ProcessInstancesLambda.Arn}",
                      "End": true
                    }
                  }
                },
                "End": true
              }
            }
          }


  # IAM Role for EventBridge to invoke Step Function
  FinOpsEventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FinOpsEventBridgeInvokeStepFunctionsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowStartStepFunctionExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref FinOpsStateMachine

  # EventBridge Rule for scheduling the Step Function every 14 days
  FinOpsScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: FinOpsStepFunctionScheduleRule
      ScheduleExpression: 'cron(0 0 1/14 * ? *)'  # Every 14 days at midnight UTC
      State: ENABLED
      Targets:
        - Arn: !Ref FinOpsStateMachine
          Id: FinOpsStateMachineTarget
          RoleArn: !GetAtt FinOpsEventBridgeRole.Arn

Outputs:
  S3Bucket:
    Description: S3 Bucket for FinOps Data
    Value: !Ref FinOpsDataBucket

  AccountQueueURL:
    Description: URL of SQS Queue for Account Processing
    Value: !Ref FinOpsAccountQueue

  DeadLetterQueueURL:
    Description: URL of Dead Letter Queue
    Value: !Ref FinOpsDLQ

  StepFunctionArn:
    Description: ARN of FinOps Step Functions State Machine
    Value: !Ref FinOpsStateMachine

  EventBridgeRuleName:
    Description: EventBridge Schedule Rule Name
    Value: !Ref FinOpsScheduleRule
